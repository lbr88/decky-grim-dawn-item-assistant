name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:ui
      - run: pnpm run build
      - run: python3 -m unittest discover -v
      - run: bash scripts/package-release.sh
      - name: Prepare plugin release assets
        run: |
          mkdir -p release-assets
          cp dist-release/decky-grim-dawn-item-assistant.zip release-assets/
          cp scripts/install.sh release-assets/install-gdia-decky.sh
          cp Install-GDIA-Decky.desktop release-assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-assets
          path: release-assets/*
          if-no-files-found: error

  item-assistant-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: marius00/iagd
          ref: b6f4e6f0fbb8f9b43d92af2f1380ef2a6f8eb1cb
          path: upstream/iagd
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Apply pinned bridge patch
        shell: bash
        run: bash scripts/apply-item-assistant-bridge.sh upstream/iagd
      - name: Build patched Item Assistant
        shell: pwsh
        run: >-
          dotnet build upstream/iagd/IAGrim-core.sln
          -c Release
          --nologo
      - name: Verify bridge output
        shell: pwsh
        run: scripts/verify-bridge-build.ps1 upstream/iagd
      - name: Package bridge
        shell: pwsh
        run: |
          $dll = "upstream/iagd/IAGrim/bin/Release/net10.0-windows/IAGrim.dll"
          if (-not (Test-Path $dll)) { throw "Missing patched IAGrim.dll" }
          $patchedHash = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          $output = "bridge-release"
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item $dll "$output/IAGrim.dll"
          Copy-Item "upstream/iagd/LICENSE" "$output/LICENSE-Item-Assistant"
          [ordered]@{
            bridgeVersion = 1
            pluginVersion = "0.3.3"
            itemAssistantVersion = "1.5.9700.13021"
            sourceCommit = "b6f4e6f0fbb8f9b43d92af2f1380ef2a6f8eb1cb"
            originalDllSha256 = "f949ef06c1eabd3521062a02be01d2f639aea19334479c7820643b45197c0d6e"
            patchedDllSha256 = $patchedHash
          } | ConvertTo-Json | Set-Content -Encoding utf8 "$output/bridge-manifest.json"
          Compress-Archive -Path "$output/*" -DestinationPath "iagd-decky-bridge.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-assets
          path: iagd-decky-bridge.zip
          if-no-files-found: error

  publish:
    needs: [plugin, item-assistant-bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-assets"
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum decky-grim-dawn-item-assistant.zip iagd-decky-bridge.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/decky-grim-dawn-item-assistant.zip
          release-assets/iagd-decky-bridge.zip
          release-assets/SHA256SUMS
          release-assets/install-gdia-decky.sh
          release-assets/Install-GDIA-Decky.desktop
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
